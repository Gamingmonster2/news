<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEWS.COM.LY | Global Technology Insights</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23111827'/><text x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-family='Georgia, serif' font-size='68' font-weight='900' fill='%23ffffff'>N</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,700;1,6..72,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-headline { font-family: 'Newsreader', serif; }
        .border-double-black { border-top: 3px double #111; border-bottom: 3px double #111; }
        .skeleton { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; background: #f3f4f6; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body class="bg-white text-gray-900 min-h-screen flex flex-col antialiased">

    <header class="container mx-auto px-4 sm:px-6 lg:px-8 pt-6 pb-4">
        <div class="flex flex-col sm:flex-row justify-between items-center pb-4 border-b border-gray-200 text-xs text-gray-500 uppercase tracking-widest gap-2">
            <span id="date-display" class="font-medium"></span>
            <span class="text-[11px] tracking-widest text-gray-400">Global Edition &bull; Live Updates</span>
        </div>

        <div class="text-center py-6 sm:py-8">
            <div class="inline-flex items-center justify-center gap-3 sm:gap-4 flex-wrap">
                <h1 class="text-3xl sm:text-5xl md:text-6xl lg:text-7xl font-black tracking-tight uppercase text-black break-words">NEWS.COM.LY</h1>
            </div>
            <p class="mt-2 text-sm sm:text-base md:text-lg italic text-gray-600 font-headline">The Technology Chronicle & Global Insights</p>
        </div>

        <nav class="border-double-black py-2.5 sm:py-3 text-center my-3 sm:my-5">
            <span class="text-xs sm:text-sm uppercase tracking-[0.25em] font-bold text-gray-800">Latest Technology Dispatches</span>
        </nav>
    </header>

    <main class="container mx-auto px-4 sm:px-6 lg:px-8 pb-16 flex-grow">
        <div id="loader" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8">
            <div class="col-span-1 md:col-span-2 lg:col-span-3 h-80 sm:h-96 skeleton rounded-sm"></div>
            <div class="h-80 skeleton rounded-sm"></div>
            <div class="h-80 skeleton rounded-sm"></div>
            <div class="h-80 skeleton rounded-sm"></div>
        </div>
        <div id="news-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 sm:gap-10"></div>
    </main>

    <footer class="border-t border-gray-200 mt-auto bg-white py-10 text-center text-gray-500 text-xs sm:text-sm">
        <div class="container mx-auto px-4 space-y-2">
            <p class="font-medium tracking-wide uppercase text-black">NEWS.COM.LY</p>
            <p>&copy; <span id="year-display"></span> NEWS.COM.LY &bull; Premium Editorial Tech News.</p>
        </div>
    </footer>

    <script>
        const API_KEY = 'I4YzYRgbdMpnNFDAGcQSMjQGMCA0ZQyOtM0DTygjuNAQAxJN';
        const newsContainer = document.getElementById('news-container');
        const loader = document.getElementById('loader');

        document.getElementById('date-display').innerText = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        document.getElementById('year-display').innerText = new Date().getFullYear();

        async function fetchNews() {
            try {
                const response = await fetch(`https://api.nytimes.com/svc/topstories/v2/technology.json?api-key=${API_KEY}`, {
                    cache: 'no-cache'
                });
                
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();
                
                const validArticles = (data.results || []).filter(n => n.multimedia && n.multimedia.length > 0 && n.title);
                
                if (validArticles.length > 0) {
                    renderNews(validArticles);
                } else {
                    newsContainer.innerHTML = `<p class="col-span-full text-center text-gray-500 py-12">No stories available.</p>`;
                }
                loader.classList.add('hidden');
            } catch (err) {
                console.error('Fetch error:', err);
                loader.classList.add('hidden');
                newsContainer.innerHTML = `
                    <div class="col-span-full text-center py-12">
                        <p class="text-red-700 font-semibold mb-2">Unable to retrieve latest dispatches.</p>
                        <p class="text-xs text-gray-500">Service connection issue. Retrying automatically.</p>
                    </div>
                `;
            }
        }

        function renderNews(articles) {
            const hero = articles[0];
            const others = articles.slice(1, 10);
            let html = `
                <article class="col-span-1 md:col-span-2 lg:col-span-3 grid grid-cols-1 lg:grid-cols-12 gap-8 border-b border-gray-300 pb-10">
                    <div class="lg:col-span-7 bg-gray-100"><img src="${hero.multimedia[0].url}" class="w-full h-80 lg:h-[450px] object-cover"></div>
                    <div class="lg:col-span-5 flex flex-col justify-center">
                        <h2 class="text-4xl font-bold font-headline mb-4"><a href="${hero.url}" target="_blank">${hero.title}</a></h2>
                        <p class="text-gray-700 mb-6">${hero.abstract}</p>
                        <a href="${hero.url}" target="_blank" class="font-bold uppercase text-sm border-b-2 border-black inline-block w-fit">Read Full Story</a>
                    </div>
                </article>
            `;
            others.forEach(a => {
                html += `
                    <article class="flex flex-col border-b border-gray-200 pb-6">
                        <img src="${a.multimedia[0].url}" class="w-full h-48 object-cover mb-4">
                        <h3 class="text-xl font-bold font-headline mb-2 leading-tight"><a href="${a.url}" target="_blank">${a.title}</a></h3>
                        <p class="text-sm text-gray-600 flex-grow">${a.abstract}</p>
                    </article>`;
            });
            newsContainer.innerHTML = html;
        }

        fetchNews();
    </script>
</body>
</html>
