<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEWS.COM.LY | Global Technology Insights</title>
    <!-- Editorial "N" SVG Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23111827'/><text x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-family='Georgia, serif' font-size='68' font-weight='900' fill='%23ffffff'>N</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,700;1,6..72,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-headline { font-family: 'Newsreader', serif; }
        .border-double-black { border-top: 3px double #111; border-bottom: 3px double #111; }
        .skeleton { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; background: #f3f4f6; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body class="bg-white text-gray-900 min-h-screen flex flex-col antialiased">

    <!-- Header -->
    <header class="container mx-auto px-4 sm:px-6 lg:px-8 pt-6 pb-4">
        <!-- Top Bar -->
        <div class="flex flex-col sm:flex-row justify-between items-center pb-4 border-b border-gray-200 text-xs text-gray-500 uppercase tracking-widest gap-2">
            <span id="date-display" class="font-medium"></span>
            <span class="text-[11px] tracking-widest text-gray-400">Global Edition &bull; Live Updates</span>
        </div>

        <!-- Masthead -->
        <div class="text-center py-6 sm:py-8">
            <div class="inline-flex items-center justify-center gap-3 sm:gap-4 flex-wrap">
                <!-- Press / Newspaper Editorial SVG Logo -->
                <svg class="w-8 h-8 sm:w-11 sm:h-11 text-black flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/>
                    <path d="M18 14h-8"/>
                    <path d="M15 18h-5"/>
                    <path d="M10 6h8v4h-8V6Z"/>
                </svg>
                <h1 class="text-3xl sm:text-5xl md:text-6xl lg:text-7xl font-black tracking-tight uppercase text-black break-words">
                    NEWS.COM.LY
                </h1>
            </div>
            <p class="mt-2 text-sm sm:text-base md:text-lg italic text-gray-600 font-headline">The Technology Chronicle & Global Insights</p>
        </div>

        <!-- Section Navigation Banner -->
        <nav class="border-double-black py-2.5 sm:py-3 text-center my-3 sm:my-5">
            <span class="text-xs sm:text-sm uppercase tracking-[0.25em] font-bold text-gray-800">
                Latest Technology Dispatches
            </span>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 sm:px-6 lg:px-8 pb-16 flex-grow">
        <!-- Skeleton Loader -->
        <div id="loader" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8">
            <div class="col-span-1 md:col-span-2 lg:col-span-3 h-80 sm:h-96 skeleton rounded-sm"></div>
            <div class="h-80 skeleton rounded-sm"></div>
            <div class="h-80 skeleton rounded-sm"></div>
            <div class="h-80 skeleton rounded-sm"></div>
        </div>

        <!-- News Grid Container -->
        <div id="news-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 sm:gap-10">
            <!-- News injected dynamically -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-200 mt-auto bg-white py-10 text-center text-gray-500 text-xs sm:text-sm">
        <div class="container mx-auto px-4 space-y-2">
            <p class="font-medium tracking-wide uppercase text-black">NEWS.COM.LY</p>
            <p>&copy; <span id="year-display"></span> NEWS.COM.LY &bull; Premium Editorial Tech News. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const API_KEY = 'I4YzYRgbdMpnNFDAGcQSMjQGMCA0ZQyOtM0DTygjuNAQAxJN';
        const newsContainer = document.getElementById('news-container');
        const loader = document.getElementById('loader');

        // Set Live Current Date and Dynamic Footer Year
        document.getElementById('date-display').innerText = new Date().toLocaleDateString('en-US', {
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });
        document.getElementById('year-display').innerText = new Date().getFullYear();

        // Fetch stories with cache-busting timestamp
        async function fetchNews() {
            try {
                const timestamp = Date.now();
                const response = await fetch(`https://api.nytimes.com/svc/topstories/v2/technology.json?api-key=${API_KEY}&_t=${timestamp}`);
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                
                const validArticles = (data.results || []).filter(n => n.multimedia && n.multimedia.length > 0 && n.title);
                if (validArticles.length > 0) {
                    renderNews(validArticles);
                } else {
                    newsContainer.innerHTML = `<p class="col-span-full text-center text-gray-500 py-12">No current stories available at this time.</p>`;
                }
                loader.classList.add('hidden');
            } catch (err) {
                console.error('Fetch error:', err);
                loader.classList.add('hidden');
                if (!newsContainer.innerHTML.trim()) {
                    newsContainer.innerHTML = `
                        <div class="col-span-full text-center py-12">
                            <p class="text-red-700 font-semibold mb-2">Unable to retrieve latest dispatches.</p>
                            <p class="text-xs text-gray-500">Please verify connection. Re-attempting automatically.</p>
                        </div>
                    `;
                }
            }
        }

        // Render articles with complete abstracts and mobile-first responsive layout
        function renderNews(articles) {
            const hero = articles[0];
            const others = articles.slice(1, 13);

            let html = `
                <!-- Lead Headline / Hero Section -->
                <article class="col-span-1 md:col-span-2 lg:col-span-3 grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8 items-start border-b border-gray-300 pb-10 mb-2">
                    <div class="lg:col-span-7 overflow-hidden bg-gray-100">
                        <img src="${hero.multimedia[0].url}" 
                             alt="${escapeHtml(hero.title)}" 
                             class="w-full h-64 sm:h-80 md:h-[420px] object-cover hover:scale-[1.01] transition-transform duration-300 ease-out" 
                             loading="eager">
                    </div>
                    <div class="lg:col-span-5 flex flex-col justify-between pt-1">
                        <div>
                            <div class="flex items-center gap-2 mb-2 text-xs font-bold uppercase tracking-wider text-gray-500">
                                <span class="text-red-600 font-extrabold">&bull; Lead Story</span>
                                <span>${escapeHtml(hero.byline || '')}</span>
                            </div>
                            <h2 class="text-2xl sm:text-3xl md:text-4xl font-bold font-headline leading-tight tracking-tight mb-4 text-black">
                                <a href="${hero.url}" target="_blank" rel="noopener noreferrer" class="hover:underline decoration-1 underline-offset-4">
                                    ${escapeHtml(hero.title)}
                                </a>
                            </h2>
                            <p class="text-gray-700 text-sm sm:text-base leading-relaxed mb-6 font-normal">
                                ${escapeHtml(hero.abstract)}
                            </p>
                        </div>
                        <div class="pt-4 border-t border-gray-100">
                            <a href="${hero.url}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center text-xs sm:text-sm font-bold uppercase tracking-widest text-black border-b-2 border-black pb-1 hover:text-gray-600 hover:border-gray-600 transition-colors">
                                Read Full Story &rarr;
                            </a>
                        </div>
                    </div>
                </article>
            `;

            // Grid Section for other articles
            others.forEach(article => {
                const imgUrl = article.multimedia && article.multimedia[0] ? article.multimedia[0].url : '';
                html += `
                    <article class="flex flex-col h-full border-b border-gray-200 pb-6 sm:border-b-0 sm:pb-0">
                        ${imgUrl ? `
                            <div class="overflow-hidden bg-gray-100 mb-4 h-48 sm:h-52">
                                <img src="${imgUrl}" 
                                     alt="${escapeHtml(article.title)}" 
                                     class="w-full h-full object-cover hover:scale-105 transition-transform duration-300"
                                     loading="lazy">
                            </div>
                        ` : ''}
                        <div class="flex flex-col flex-grow">
                            <span class="text-[11px] font-bold uppercase tracking-wider text-gray-400 mb-1.5">
                                ${escapeHtml(article.byline || 'Dispatch')}
                            </span>
                            <h3 class="text-lg sm:text-xl font-bold font-headline leading-snug mb-3 text-black">
                                <a href="${article.url}" target="_blank" rel="noopener noreferrer" class="hover:underline decoration-1 underline-offset-2">
                                    ${escapeHtml(article.title)}
                                </a>
                            </h3>
                            <p class="text-gray-600 text-sm leading-relaxed mb-4 flex-grow font-normal">
                                ${escapeHtml(article.abstract)}
                            </p>
                            <a href="${article.url}" target="_blank" rel="noopener noreferrer" class="text-xs font-bold uppercase tracking-widest text-black border-t border-gray-200 pt-3 mt-auto hover:text-gray-500 transition-colors inline-block">
                                Read Article &rarr;
                            </a>
                        </div>
                    </article>
                `;
            });

            newsContainer.innerHTML = html;
        }

        // Helper to avoid HTML injection
        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // Initial Load
        fetchNews();

        // Auto-refresh every 3 hours (3 * 60 * 60 * 1000 ms)
        const REFRESH_INTERVAL = 3 * 60 * 60 * 1000;
        setInterval(fetchNews, REFRESH_INTERVAL);
    </script>
</body>
</html>
