<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEWS.COM.LY | Global Technology Insights</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .rtl { direction: rtl; font-family: 'Amiri', serif; }
        .border-double-black { border-top: 4px double #111; border-bottom: 4px double #111; }
        .skeleton { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; background: #e5e7eb; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body class="bg-white text-gray-900">

    <!-- Header -->
    <header class="container mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-4 text-sm text-gray-500 uppercase tracking-widest">
            <span id="date-display"></span>
            <button id="lang-toggle" class="hover:text-black font-bold border px-2 py-1">AR / EN</button>
        </div>
        <div class="text-center py-6">
            <h1 class="text-5xl md:text-7xl font-black tracking-tighter uppercase">NEWS.COM.LY</h1>
            <p class="mt-2 text-xl italic text-gray-600" id="section-title">Technology Daily</p>
        </div>
        <nav class="border-double-black py-3 text-center my-6">
            <span class="uppercase tracking-[0.2em] font-bold" id="nav-text">Latest Tech Updates</span>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 pb-20">
        <div id="loader" class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="md:col-span-3 h-96 skeleton"></div>
            <div class="h-64 skeleton"></div>
            <div class="h-64 skeleton"></div>
            <div class="h-64 skeleton"></div>
        </div>

        <div id="news-container" class="grid grid-cols-1 md:grid-cols-3 gap-10">
            <!-- News injected here -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t py-12 text-center text-gray-400 text-sm">
        <p>&copy; 2024 NEWS.COM.LY - Premium Editorial Tech News</p>
    </footer>

    <script>
        const API_KEY = 'I4YzYRgbdMpnNFDAGcQSMjQGMCA0ZQyOtM0DTygjuNAQAxJN';
        const newsContainer = document.getElementById('news-container');
        const loader = document.getElementById('loader');
        let isRTL = false;

        async function fetchNews() {
            try {
                const response = await fetch(`https://api.nytimes.com/svc/topstories/v2/technology.json?api-key=${API_KEY}`);
                const data = await response.json();
                renderNews(data.results.filter(n => n.multimedia && n.multimedia.length > 0));
                loader.classList.add('hidden');
            } catch (err) {
                newsContainer.innerHTML = `<p class="text-red-600 col-span-3 text-center">Failed to load news. Please check your connection.</p>`;
                loader.classList.add('hidden');
            }
        }

        function renderNews(articles) {
            const hero = articles[0];
            const others = articles.slice(1, 10);

            // Hero Section
            newsContainer.innerHTML = `
                <div class="md:col-span-3 grid md:grid-cols-2 gap-8 items-center border-b pb-10 mb-10">
                    <img src="${hero.multimedia[0].url}" class="w-full h-96 object-cover" alt="hero">
                    <div>
                        <span class="text-xs font-bold uppercase tracking-widest text-gray-400">${hero.byline}</span>
                        <h2 class="text-4xl font-bold mt-2 mb-4 leading-tight">${hero.title}</h2>
                        <p class="text-gray-600 mb-6">${hero.abstract}</p>
                        <a href="${hero.url}" target="_blank" class="border-b-2 border-black pb-1 hover:text-gray-500">Read Full Story →</a>
                    </div>
                </div>
            `;

            // Grid Section
            others.forEach(article => {
                newsContainer.innerHTML += `
                    <article class="flex flex-col">
                        <img src="${article.multimedia[0].url}" class="w-full h-64 object-cover mb-4" alt="news">
                        <h3 class="text-xl font-bold mb-2 leading-snug">${article.title}</h3>
                        <p class="text-sm text-gray-500 mb-4 flex-grow">${article.abstract.substring(0, 100)}...</p>
                        <a href="${article.url}" target="_blank" class="text-sm font-bold uppercase tracking-widest mt-auto border-t pt-4">Read Article</a>
                    </article>
                `;
            });
        }

        document.getElementById('lang-toggle').addEventListener('click', () => {
            isRTL = !isRTL;
            document.body.classList.toggle('rtl');
            document.getElementById('section-title').innerText = isRTL ? 'أخبار التكنولوجيا اليومية' : 'Technology Daily';
            document.getElementById('nav-text').innerText = isRTL ? 'آخر تحديثات التقنية' : 'Latest Tech Updates';
        });

        document.getElementById('date-display').innerText = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        fetchNews();
    </script>
</body>
</html>
